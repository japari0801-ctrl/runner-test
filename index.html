<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>자파리 웜업 러너 - 모션 인식 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      overflow: hidden;
      background: #000;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
      opacity: 0.35; /* 게임 화면 느낌을 위해 카메라를 반투명 처리 */
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 관절선도 거울 모드로 일치 */
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      pointer-events: none;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #38bdf8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .action-display {
      font-size: 32px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    .stats-box {
      position: absolute;
      bottom: 24px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }
  </style>

  <!-- Google MediaPipe Pose 라이브러리 (설치 없이 웹에서 바로 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="hud">
      <div class="status-badge" id="lane-indicator">LANE: CENTER</div>
      <div class="action-display" id="action-indicator">READY</div>
    </div>

    <div class="stats-box">
      <div>스텝 카운트: <strong id="step-count" style="color:#38bdf8;">0</strong></div>
      <div>자세 판정: <strong id="pose-state" style="color:#4ade80;">대기 중</strong></div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const laneIndicator = document.getElementById('lane-indicator');
    const actionIndicator = document.getElementById('action-indicator');
    const stepCountDisplay = document.getElementById('step-count');
    const poseStateDisplay = document.getElementById('pose-state');

    let baseHipY = null;
    let stepCount = 0;
    let lastStepTime = 0;
    let prevAnkleDiff = 0;

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (!results.poseLandmarks) {
        actionIndicator.innerText = "화면 중앙에 서주세요";
        canvasCtx.restore();
        return;
      }

      const lm = results.poseLandmarks;

      // 1. 관절 포인트 추출 (MediaPipe 기준)
      const leftShoulder = lm[11];
      const rightShoulder = lm[12];
      const leftHip = lm[23];
      const rightHip = lm[24];
      const leftAnkle = lm[27];
      const rightAnkle = lm[28];

      // 몸의 중심 좌표 (골반 중심)
      const centerX = (leftHip.x + rightHip.x) / 2;
      const currentHipY = (leftHip.y + rightHip.y) / 2;

      // 기준 높이 보정 (초기 10프레임 동안 기준 높이 수렴)
      if (baseHipY === null) {
        baseHipY = currentHipY;
      } else {
        baseHipY = baseHipY * 0.95 + currentHipY * 0.05;
      }

      // --- [동작 판정 로직] ---

      // 1) 레인 이동 판정 (X축: 0~1)
      let currentLane = "CENTER";
      if (centerX < 0.40) {
        currentLane = "RIGHT"; // 거울 모드이므로 화면 좌측이 플레이어의 우측
      } else if (centerX > 0.60) {
        currentLane = "LEFT";
      }
      laneIndicator.innerText = `LANE: ${currentLane}`;

      // 2) 점프 & 숙이기 (스쿼트) 판정 (골반 Y축 변위)
      const yDiff = baseHipY - currentHipY; // 위로 뛰면 양수(+), 아래로 숙이면 음수(-)
      let actionText = "RUNNING";
      let stateDetail = "기본 주행";

      if (yDiff > 0.07) {
        actionText = "JUMP! 🦘";
        stateDetail = "점프 중";
      } else if (yDiff < -0.07) {
        actionText = "DUCK! ⬇️";
        stateDetail = "숙이기 중";
      } else {
        // 3) 제자리 달리기 판정 (발목/무릎 교차 상하 왕복 감지)
        const ankleDiff = Math.abs(leftAnkle.y - rightAnkle.y);
        const now = Date.now();
        if (ankleDiff > 0.05 && prevAnkleDiff <= 0.05 && (now - lastStepTime > 250)) {
          stepCount++;
          lastStepTime = now;
          stepCountDisplay.innerText = stepCount;
        }
        prevAnkleDiff = ankleDiff;
      }

      actionIndicator.innerText = actionText;
      poseStateDisplay.innerText = stateDetail;

      // --- [관절 뼈대 시각화: 반투명 네온 라인] ---
      drawGhostSkeleton(canvasCtx, lm);

      canvasCtx.restore();
    }

    // 반투명 고스트 관절 그리기
    function drawGhostSkeleton(ctx, landmarks) {
      const connections = [
        [11, 12], [11, 23], [12, 24], [23, 24], // 몸통
        [11, 13], [13, 15], [12, 14], [14, 16], // 팔
        [23, 25], [25, 27], [24, 26], [26, 28]  // 다리
      ];

      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(56, 189, 248, 0.7)"; // 시원한 스카이블루 반투명
      ctx.lineCap = "round";

      connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        if (p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
          ctx.beginPath();
          ctx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
          ctx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
          ctx.stroke();
        }
      });
    }

    // MediaPipe Pose 초기화
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1, // 0: 초경량, 1: 밸런스(권장), 2: 고정밀
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // 카메라 실행
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 480,
      height: 640
    });
    camera.start();
  </script>
</body>
</html>
