<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>자파리 웜업 러너</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    /* 1. 모션 인식 준비/검증 화면 (Pre-Game Screen) */
    #setup-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090d16;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }
    .setup-header {
      text-align: center;
    }
    .setup-title {
      font-size: 22px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .setup-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .cam-box-wrap {
      position: relative;
      width: 86vw;
      max-width: 340px;
      height: 60vh;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #334155;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    #setup-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #setup-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    /* 가이드 실루엣 박스 */
    .guide-box {
      position: absolute;
      top: 8%;
      left: 15%;
      width: 70%;
      height: 84%;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      pointer-events: none;
      box-sizing: border-box;
      transition: all 0.3s;
    }
    .guide-box.ready {
      border-color: #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.35);
    }

    .setup-footer {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #status-msg {
      font-size: 16px;
      font-weight: 800;
      color: #facc15;
      text-align: center;
      min-height: 24px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    #pose-progress {
      width: 0%;
      height: 100%;
      background: #4ade80;
      transition: width 0.1s linear;
    }
    .start-game-btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 900;
      border: none;
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      transition: all 0.2s;
    }
    .start-game-btn.active {
      background: #38bdf8;
      color: #020617;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }

    /* 2. 실제 게임 화면 캔버스 & HUD */
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #cam-preview {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 105px;
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10;
      background: #000;
    }
    #in-game-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #38bdf8;
      font-weight: 800;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #38bdf8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .action-display {
      font-size: 28px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    .dashboard-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .speed-gauge-wrap {
      width: 90px;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    #speed-gauge {
      width: 20%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.15s ease-out;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- [1] 시작 전 모션 확인 & 승인 화면 -->
  <div id="setup-screen">
    <div class="setup-header">
      <div class="setup-title">자파리 웜업 러너</div>
      <div class="setup-sub">카메라 앞에 서서 온몸을 가이드 박스에 맞춰주세요</div>
    </div>

    <div class="cam-box-wrap">
      <video id="setup-video" playsinline></video>
      <canvas id="setup-canvas"></canvas>
      <div class="guide-box" id="guide-box"></div>
    </div>

    <div class="setup-footer">
      <div id="status-msg">카메라 연결 중...</div>
      <div class="progress-bar-wrap">
        <div id="pose-progress"></div>
      </div>
      <button class="start-game-btn" id="start-btn" onclick="confirmAndStartGame()">자리 잡기 필요</button>
    </div>
  </div>

  <!-- [2] 실제 3D 게임 화면 -->
  <canvas id="game-canvas"></canvas>

  <div class="dashboard-panel">
    <div>SCORE: <span id="score" style="color: #38bdf8;">0</span></div>
    <div>속도: <span id="speed-text" style="color: #4ade80;">보통</span></div>
    <div class="speed-gauge-wrap">
      <div id="speed-gauge"></div>
    </div>
  </div>

  <div id="hud">
    <div class="hud-title">ZAPARI WARM-UP RUNNER</div>
    <div class="status-badge" id="lane-indicator">LANE: CENTER</div>
    <div class="action-display" id="action-indicator">READY</div>
  </div>

  <div id="cam-preview" style="display: none;">
    <video id="in-game-video" playsinline></video>
  </div>

  <script>
    let isGameRunning = false;

    // --- 오디오 신디사이저 ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playSuccessSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    }
    function playHitSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // --- 3D Three.js 엔진 ---
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1128);
    scene.fog = new THREE.Fog(0x0a1128, 40, 110);

    const camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera3D.position.set(0, 3.8, 7.5);
    camera3D.lookAt(0, 1.2, -15);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(5, 12, 10);
    scene.add(dirLight);

    const laneX = { LEFT: -2.8, CENTER: 0, RIGHT: 2.8 };
    const roadGeo = new THREE.PlaneGeometry(10, 160);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -70;
    scene.add(road);

    const playerGroup = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65 });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.3, 16), bodyMat);
    torso.position.y = 1.3;
    playerGroup.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), bodyMat);
    head.position.y = 2.2;
    playerGroup.add(head);
    scene.add(playerGroup);

    const MIN_SPEED = 0.25;
    const MAX_SPEED = 1.05;
    let currentSpeed = MIN_SPEED;
    let targetSpeed = MIN_SPEED;
    const obstacles = [];
    let score = 0;

    function spawnObstacle() {
      if (!isGameRunning) return;
      const type = Math.floor(Math.random() * 3);
      const obsGroup = new THREE.Group();

      if (type === 0) {
        const lanes = [-2.8, 0, 2.8];
        const targetX = lanes[Math.floor(Math.random() * lanes.length)];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.5, 1), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
        mesh.position.set(targetX, 1.25, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'LANE', x: targetX, hit: false };
      } else if (type === 1) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.6, 1.2), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
        mesh.position.set(0, 0.3, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'JUMP', hit: false };
      } else {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(8.5, 2.0, 1.5), new THREE.MeshLambertMaterial({ color: 0x8b5cf6 }));
        mesh.position.set(0, 2.4, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'DUCK', hit: false };
      }

      obsGroup.position.z = -90;
      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }
    setInterval(spawnObstacle, 2400);

    // --- 모션 인식 변수 ---
    let targetX = 0;
    let targetY = 0;
    let smoothCenterX = 0.5;
    let baseHipY = null;

    let currentLaneState = "CENTER";
    let currentPoseAction = "RUN";
    let lastActionChangeTime = 0;

    let lastAnkleDelta = 0;
    let stepTimestamps = [];

    // [캘리브레이션 전용 변수]
    let calibrationFrames = 0;
    const REQUIRED_FRAMES = 90; // 약 3초 유지 시 완료
    const statusMsg = document.getElementById('status-msg');
    const startBtn = document.getElementById('start-btn');
    const poseProgress = document.getElementById('pose-progress');
    const guideBox = document.getElementById('guide-box');
    const setupCanvas = document.getElementById('setup-canvas');
    const setupCtx = setupCanvas.getContext('2d');

    const laneIndicator = document.getElementById('lane-indicator');
    const actionIndicator = document.getElementById('action-indicator');
    const scoreDisplay = document.getElementById('score');
    const speedText = document.getElementById('speed-text');
    const speedGauge = document.getElementById('speed-gauge');

    function onPoseResults(results) {
      if (!results.poseLandmarks) {
        if (!isGameRunning) handleCalibrationFail("카메라 앞에 서주세요! 👤");
        return;
      }

      const lm = results.poseLandmarks;
      const nose = lm[0];
      const leftShoulder = lm[11];
      const rightShoulder = lm[12];
      const leftHip = lm[23];
      const rightHip = lm[24];
      const leftAnkle = lm[27];
      const rightAnkle = lm[28];

      // === [1단계: 시작 전 위치 및 인식 확인 모드] ===
      if (!isGameRunning) {
        setupCanvas.width = videoElement.videoWidth;
        setupCanvas.height = videoElement.videoHeight;
        setupCtx.clearRect(0, 0, setupCanvas.width, setupCanvas.height);

        // 관절 뼈대 시각화
        drawSkeleton(setupCtx, lm, setupCanvas.width, setupCanvas.height);

        // 핵심 관절 체크 (전신이 잘 들어왔는지)
        const isUpperVisible = nose && nose.visibility > 0.5 && leftShoulder && rightShoulder;
        const isHipVisible = leftHip && rightHip && leftHip.visibility > 0.5;
        const isLegVisible = (leftAnkle && leftAnkle.visibility > 0.4) || (rightAnkle && rightAnkle.visibility > 0.4);

        if (!isUpperVisible || !isHipVisible) {
          handleCalibrationFail("상포인트가 덜 잡힙니다. 1.5m 뒤로 물러서세요!");
          return;
        }

        const centerX = (leftHip.x + rightHip.x) / 2;
        if (centerX < 0.25 || centerX > 0.75) {
          handleCalibrationFail("화면 중앙으로 와주세요! ↔️");
          return;
        }

        // 안정적인 위치 확인 완료 -> 3초 카운트다운 게이지 채우기
        calibrationFrames++;
        const percent = Math.min(100, Math.floor((calibrationFrames / REQUIRED_FRAMES) * 100));
        poseProgress.style.width = percent + "%";
        guideBox.classList.add('ready');

        if (calibrationFrames < REQUIRED_FRAMES) {
          statusMsg.innerText = `자세 완벽! 3초간 멈춰주세요... (${Math.ceil((REQUIRED_FRAMES - calibrationFrames) / 30)}초)`;
          statusMsg.style.color = "#4ade80";
        } else {
          statusMsg.innerText = "모션 인식 준비 완료! 게임을 시작하세요!";
          statusMsg.style.color = "#38bdf8";
          startBtn.classList.add('active');
          startBtn.innerText = "게임 시작! 🚀";
        }
        return;
      }

      // === [2단계: 게임 진행 중 실시간 판정 모드] ===
      if (!leftHip || !rightHip) return;

      const rawCenterX = (leftHip.x + rightHip.x) / 2;
      const currentHipY = (leftHip.y + rightHip.y) / 2;

      smoothCenterX = smoothCenterX * 0.75 + rawCenterX * 0.25;

      if (baseHipY === null) {
        baseHipY = currentHipY;
      } else {
        baseHipY = baseHipY * 0.985 + currentHipY * 0.015;
      }

      // 1) 레인 이동
      if (smoothCenterX < 0.35) {
        currentLaneState = "RIGHT";
        targetX = laneX.RIGHT;
      } else if (smoothCenterX > 0.65) {
        currentLaneState = "LEFT";
        targetX = laneX.LEFT;
      } else {
        currentLaneState = "CENTER";
        targetX = laneX.CENTER;
      }
      laneIndicator.innerText = `LANE: ${currentLaneState}`;

      // 2) 점프 & 숙이기 (0.35초 쿨다운)
      const now = Date.now();
      const yDiff = baseHipY - currentHipY;

      if (now - lastActionChangeTime > 350) {
        if (yDiff > 0.11) {
          if (currentPoseAction !== "JUMP") {
            currentPoseAction = "JUMP";
            lastActionChangeTime = now;
            playTone(659.25, 0.18, 'sine');
          }
          targetY = 1.6;
          actionIndicator.innerText = "JUMP! 🦘";
        } else if (yDiff < -0.11) {
          if (currentPoseAction !== "DUCK") {
            currentPoseAction = "DUCK";
            lastActionChangeTime = now;
            playTone(329.63, 0.22, 'triangle');
          }
          targetY = -0.6;
          actionIndicator.innerText = "DUCK! ⬇️";
        } else {
          currentPoseAction = "RUN";
          targetY = 0;
          actionIndicator.innerText = "RUNNING 🏃";
        }
      }

      // 3) 발구르기
      if (currentPoseAction === "RUN" && leftAnkle && rightAnkle) {
        const ankleDelta = Math.abs(leftAnkle.y - rightAnkle.y);
        if (ankleDelta > 0.08 && lastAnkleDelta <= 0.08) {
          stepTimestamps.push(now);
        }
        lastAnkleDelta = ankleDelta;
      }

      stepTimestamps = stepTimestamps.filter(t => now - t < 2000);
      const stepsInLastTwoSec = stepTimestamps.length;

      if (stepsInLastTwoSec >= 5) {
        targetSpeed = MAX_SPEED;
        speedText.innerText = "부스터! 🔥";
        speedText.style.color = "#ef4444";
      } else if (stepsInLastTwoSec >= 2) {
        targetSpeed = 0.65;
        speedText.innerText = "조깅 중 🏃";
        speedText.style.color = "#4ade80";
      } else {
        targetSpeed = MIN_SPEED;
        speedText.innerText = "천천히 🚶";
        speedText.style.color = "#94a3b8";
      }

      const gaugePercent = ((targetSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)) * 100;
      speedGauge.style.width = `${Math.max(15, gaugePercent)}%`;
    }

    // 인식 위치 이탈 시 리셋
    function handleCalibrationFail(msg) {
      calibrationFrames = 0;
      poseProgress.style.width = "0%";
      guideBox.classList.remove('ready');
      statusMsg.innerText = msg;
      statusMsg.style.color = "#facc15";
      startBtn.classList.remove('active');
      startBtn.innerText = "자리 잡기 필요";
    }

    // 관절선 그리기 헬퍼 함수
    function drawSkeleton(ctx, landmarks, w, h) {
      const connections = [
        [11, 12], [11, 23], [12, 24], [23, 24],
        [11, 13], [13, 15], [12, 14], [14, 16],
        [23, 25], [25, 27], [24, 26], [26, 28]
      ];
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#38bdf8";
      ctx.lineCap = "round";

      connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        if (p1 && p2 && p1.visibility > 0.4 && p2.visibility > 0.4) {
          ctx.beginPath();
          ctx.moveTo(p1.x * w, p1.y * h);
          ctx.lineTo(p2.x * w, p2.y * h);
          ctx.stroke();
        }
      });
    }

    // [게임 시작 승인 버튼]
    function confirmAndStartGame() {
      if (calibrationFrames < REQUIRED_FRAMES) return;
      initAudio();
      isGameRunning = true;

      // 셋업 화면 숨기고 우측 하단 미니캠 활성화
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('cam-preview').style.display = 'block';
      const inGameVideo = document.getElementById('in-game-video');
      inGameVideo.srcObject = videoElement.srcObject;
      inGameVideo.play();

      playSuccessSound();
    }

    // --- 3D 게임 루프 ---
    function animate() {
      requestAnimationFrame(animate);

      if (isGameRunning) {
        currentSpeed += (targetSpeed - currentSpeed) * 0.08;

        playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
        playerGroup.position.y += (targetY - playerGroup.position.y) * 0.18;

        if (currentPoseAction === "RUN") {
          playerGroup.position.y = Math.abs(Math.sin(Date.now() * (0.015 * (currentSpeed / 0.5)))) * 0.18;
        }

        road.position.z += currentSpeed;
        if (road.position.z > -50) road.position.z = -70;

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += currentSpeed;

          if (obs.position.z > -1.2 && obs.position.z < 1.2 && !obs.userData.hit) {
            const type = obs.userData.type;
            let safe = true;

            if (type === 'LANE' && Math.abs(playerGroup.position.x - obs.userData.x) < 1.1) {
              safe = false;
            } else if (type === 'JUMP' && playerGroup.position.y < 0.8) {
              safe = false;
            } else if (type === 'DUCK' && playerGroup.position.y > -0.2) {
              safe = false;
            }

            if (!safe) {
              obs.userData.hit = true;
              playHitSound();
              if (navigator.vibrate) navigator.vibrate(120);
              document.body.style.backgroundColor = "#7f1d1d";
              setTimeout(() => document.body.style.backgroundColor = "#020617", 90);
            }
          }

          if (obs.position.z > 8) {
            if (!obs.userData.hit) {
              score += 10;
              scoreDisplay.innerText = score;
              playSuccessSound();
            }
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera3D);
    }
    animate();

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 웹캠 구동 ---
    const videoElement = document.getElementById('setup-video');
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 480,
      height: 640
    });
    camera.start();
  </script>
</body>
</html>
