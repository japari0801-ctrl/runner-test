<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>자파리 웜업 러너</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    /* 구석에 작게 띄우는 내 웹캠 화면 (거울) */
    #cam-preview {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 110px;
      height: 146px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    /* HUD 상단 인터페이스 */
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #38bdf8;
      font-weight: 800;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #38bdf8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .action-display {
      font-size: 28px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    .score-board {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }
  </style>

  <!-- Google MediaPipe Pose 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <!-- Three.js 3D 그래픽 엔진 (가볍고 빠른 렌더링) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div class="score-board">
    SCORE: <span id="score" style="color: #38bdf8;">0</span>
  </div>

  <div id="hud">
    <div class="hud-title">ZAPARI WARM-UP RUNNER</div>
    <div class="status-badge" id="lane-indicator">LANE: CENTER</div>
    <div class="action-display" id="action-indicator">READY</div>
  </div>

  <div id="cam-preview">
    <video id="webcam" playsinline></video>
  </div>

  <script>
    // --- 1. Three.js 3D 씬 세팅 (남극탐험 원근감) ---
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1128); // 짙은 밤하늘 네이비
    scene.fog = new THREE.Fog(0x0a1128, 40, 110); // 원경 안개 효과

    // 카메라: 플레이어 등 뒤 위쪽에서 앞(원경)을 내려다보는 백뷰 시점
    const camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera3D.position.set(0, 3.8, 7.5);
    camera3D.lookAt(0, 1.2, -15);

    // 조명
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(5, 12, 10);
    scene.add(dirLight);

    // 3개 레인 바닥 (좌: -2.8, 중: 0, 우: 2.8)
    const laneX = { LEFT: -2.8, CENTER: 0, RIGHT: 2.8 };
    const roadGeo = new THREE.PlaneGeometry(10, 160);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -70;
    scene.add(road);

    // 반투명 고스트 캐릭터 (내 몸을 따라 앞을 보고 뛰는 캐릭터)
    const playerGroup = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ 
      color: 0x38bdf8, 
      transparent: true, 
      opacity: 0.65,
      wireframe: false 
    });

    // 몸통
    const torsoGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.3, 16);
    const torso = new THREE.Mesh(torsoGeo, bodyMat);
    torso.position.y = 1.3;
    playerGroup.add(torso);

    // 머리
    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const head = new THREE.Mesh(headGeo, bodyMat);
    head.position.y = 2.2;
    playerGroup.add(head);

    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    // 장애물 목록
    const obstacles = [];
    let score = 0;
    let gameSpeed = 0.55;

    // 장애물 생성 함수
    function spawnObstacle() {
      const type = Math.floor(Math.random() * 3); // 0: 레인차단, 1: 점프회피(바닥), 2: 숙이기회피(상단)
      const obsGroup = new THREE.Group();

      if (type === 0) {
        // [좌/중/우 기둥] 특정 레인 1개를 막는 기둥
        const lanes = [-2.8, 0, 2.8];
        const targetX = lanes[Math.floor(Math.random() * lanes.length)];
        const geo = new THREE.BoxGeometry(1.6, 2.5, 1);
        const mat = new THREE.MeshLambertMaterial({ color: 0xef4444 }); // 빨강
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(targetX, 1.25, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'LANE', x: targetX };
      } else if (type === 1) {
        // [점프용 허들] 바닥 전 레인을 막는 낮은 통나무
        const geo = new THREE.BoxGeometry(8.5, 0.6, 1.2);
        const mat = new THREE.MeshLambertMaterial({ color: 0xf59e0b }); // 주황
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(0, 0.3, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'JUMP' };
      } else {
        // [숙이기용 천장 바위] 상단 전 레인을 막는 높은 장애물
        const geo = new THREE.BoxGeometry(8.5, 2.0, 1.5);
        const mat = new THREE.MeshLambertMaterial({ color: 0x8b5cf6 }); // 보라
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(0, 2.4, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'DUCK' };
      }

      obsGroup.position.z = -90; // 저 너머 소실점에서 생성
      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }

    // 2.5초마다 장애물 지속 스폰
    setInterval(spawnObstacle, 2400);

    // --- 2. 모션 트래킹 변수 & 매핑 ---
    let targetX = 0;
    let targetY = 0;
    let baseHipY = null;
    let currentLaneState = "CENTER";
    let currentPoseAction = "RUN";

    const laneIndicator = document.getElementById('lane-indicator');
    const actionIndicator = document.getElementById('action-indicator');
    const scoreDisplay = document.getElementById('score');

    function onPoseResults(results) {
      if (!results.poseLandmarks) return;

      const lm = results.poseLandmarks;
      const leftHip = lm[23];
      const rightHip = lm[24];
      if (!leftHip || !rightHip) return;

      const centerX = (leftHip.x + rightHip.x) / 2;
      const currentHipY = (leftHip.y + rightHip.y) / 2;

      if (baseHipY === null) {
        baseHipY = currentHipY;
      } else {
        baseHipY = baseHipY * 0.96 + currentHipY * 0.04; // 부드러운 기준선 갱신
      }

      // 1) 레인 이동 (X축)
      if (centerX < 0.40) {
        currentLaneState = "RIGHT";
        targetX = laneX.RIGHT;
      } else if (centerX > 0.60) {
        currentLaneState = "LEFT";
        targetX = laneX.LEFT;
      } else {
        currentLaneState = "CENTER";
        targetX = laneX.CENTER;
      }
      laneIndicator.innerText = `LANE: ${currentLaneState}`;

      // 2) 점프 & 숙이기 (Y축)
      const yDiff = baseHipY - currentHipY;
      if (yDiff > 0.065) {
        currentPoseAction = "JUMP";
        targetY = 1.6; // 점프 시 캐릭터 공중 부양
        actionIndicator.innerText = "JUMP! 🦘";
      } else if (yDiff < -0.065) {
        currentPoseAction = "DUCK";
        targetY = -0.55; // 숙이기 시 캐릭터 웅크림
        actionIndicator.innerText = "DUCK! ⬇️";
      } else {
        currentPoseAction = "RUN";
        targetY = 0;
        actionIndicator.innerText = "RUNNING 🏃";
      }
    }

    // --- 3. 게임 메인 루프 (초당 60프레임) ---
    function animate() {
      requestAnimationFrame(animate);

      // 캐릭터 위치를 목표 좌표로 부드럽게 보간 이동 (Lerp)
      playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;
      playerGroup.position.y += (targetY - playerGroup.position.y) * 0.22;

      // 달리기 중 가벼운 바운스 연출
      if (currentPoseAction === "RUN") {
        playerGroup.position.y = Math.abs(Math.sin(Date.now() * 0.012)) * 0.2;
      }

      // 바닥 격자 스크롤로 전진 속도감 연출
      road.position.z += gameSpeed;
      if (road.position.z > -50) road.position.z = -70;

      // 장애물 이동 & 판정
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += gameSpeed;

        // 충돌 영역 통과 시점 (캐릭터 근처 z: -1 ~ 1)
        if (obs.position.z > -1.2 && obs.position.z < 1.2) {
          const type = obs.userData.type;
          let safe = true;

          if (type === 'LANE' && Math.abs(playerGroup.position.x - obs.userData.x) < 1.1) {
            safe = false; // 같은 레인에 있으면 충돌
          } else if (type === 'JUMP' && playerGroup.position.y < 0.8) {
            safe = false; // 점프 안 뛰었으면 충돌
          } else if (type === 'DUCK' && playerGroup.position.y > -0.2) {
            safe = false; // 숙이지 않았으면 충돌
          }

          if (!safe) {
            document.body.style.backgroundColor = "#7f1d1d"; // 화면 번쩍
            setTimeout(() => document.body.style.backgroundColor = "#020617", 80);
          }
        }

        // 장애물이 화면 뒤로 지나갔을 때 점수 획득 및 제거
        if (obs.position.z > 8) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          score += 10;
          scoreDisplay.innerText = score;
        }
      }

      renderer.render(scene, camera3D);
    }

    animate();

    // 화면 크기 변경 대응
    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 4. 웹캠 및 MediaPipe 구동 ---
    const videoElement = document.getElementById('webcam');
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 480,
      height: 640
    });
    camera.start();
  </script>
</body>
</html>
