<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
  <title>자파리 웜업 러너</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
      width: 100vw;
      height: 100vh;
    }

    #setup-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      z-index: 100;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      gap: 32px;
    }
    .setup-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      max-width: 330px;
    }
    .brand-badge {
      display: inline-block;
      align-self: flex-start;
      background: #facc15;
      color: #0f172a;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 14px;
      letter-spacing: 1px;
    }
    .setup-title {
      font-size: 30px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 16px rgba(56,189,248,0.4);
    }
    .setup-sub {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .cam-box-wrap {
      position: relative;
      width: 52vw;
      height: 82vh;
      max-width: 480px;
      border-radius: 22px;
      overflow: hidden;
      border: 3.5px solid #38bdf8;
      background: #000;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
    }
    #setup-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #setup-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    .guide-box {
      position: absolute;
      top: 6%;
      left: 18%;
      width: 64%;
      height: 88%;
      border: 3px dashed rgba(250, 204, 21, 0.5);
      border-radius: 20px;
      pointer-events: none;
      transition: all 0.3s;
    }
    .guide-box.ready {
      border-color: #4ade80;
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.6);
    }
    #countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 96px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.9);
      pointer-events: none;
      z-index: 10;
    }
    #status-msg {
      font-size: 15px;
      font-weight: 800;
      color: #facc15;
      min-height: 22px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 14px;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    #pose-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #4ade80);
      transition: width 0.1s linear;
    }
    .auto-notice {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #cam-preview {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 130px;
      height: 98px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.8);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      z-index: 10;
      background: #000;
    }
    #in-game-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .dashboard-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid #38bdf8;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(6px);
    }
    .hud-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .hud-title-tag {
      font-size: 11px;
      background: #0284c7;
      color: #fff;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .score-val {
      color: #facc15;
      font-size: 22px;
      font-weight: 900;
    }
    .hud-action-tag {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
    }
    .speed-gauge-wrap {
      width: 120px;
      height: 9px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 3px;
    }
    #speed-gauge {
      width: 20%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #ef4444);
      transition: width 0.15s ease-out;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body onclick="unlockAudioOnFirstTouch()">

  <div id="setup-screen">
    <div class="setup-left">
      <div class="brand-badge">ZAPARI SPORTS WARM-UP</div>
      <div class="setup-title">자파리 웜업 러너</div>
      <div class="setup-sub">카메라 1.5m 뒤 박스 안에 서 계시면 3초 후 자동 시작됩니다.</div>
      <div id="status-msg">카메라 연결 중...</div>
      <div class="progress-bar-wrap">
        <div id="pose-progress"></div>
      </div>
      <div class="auto-notice">※ 화면 터치 없이 제자리에서 준비해 주세요!</div>
    </div>

    <div class="cam-box-wrap">
      <video id="setup-video" playsinline></video>
      <canvas id="setup-canvas"></canvas>
      <div class="guide-box" id="guide-box"></div>
      <div id="countdown-overlay"></div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div class="dashboard-panel">
    <div class="hud-header">
      <span class="hud-title-tag">ZAPARI</span>
      <span style="font-size: 11px; color:#94a3b8;">SPORTS CLUB</span>
    </div>
    <div>점수: <span id="score" class="score-val">0</span></div>
    <div>동작: <span id="action-indicator" class="hud-action-tag">대기 중</span></div>
    <div>위치: <span id="lane-indicator" style="color: #4ade80;">중앙</span></div>
    <div>속도: <span id="speed-text" style="color: #cbd5e1;">보통 🚶</span></div>
    <div class="speed-gauge-wrap">
      <div id="speed-gauge"></div>
    </div>
  </div>

  <div id="cam-preview" style="display: none;">
    <video id="in-game-video" playsinline></video>
  </div>

  <script>
    let isGameRunning = false;
    let isTransitioning = false;

    let audioCtx = null;
    function unlockAudioOnFirstTouch() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playSuccessSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    }
    function playHitSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfe6fd);

    const camera3D = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 220);
    camera3D.position.set(0, 4.0, 8.0);
    camera3D.lookAt(0, 0.9, -18);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(6, 14, 10);
    scene.add(dirLight);

    // 저장소에 올린 실제 파일 5종 로드
    const texLoader = new THREE.TextureLoader();
    const texPlayer = texLoader.load('player.png');
    const texDino = texLoader.load('obs_lane.png');
    const texHurdle = texLoader.load('obs_jump.png');
    const texCeiling = texLoader.load('obs_duck.png');
    const texBg = texLoader.load('bg.png');

    const bgPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 90),
      new THREE.MeshBasicMaterial({ map: texBg })
    );
    bgPlane.position.set(0, 28, -110);
    scene.add(bgPlane);

    const laneX = { LEFT: -3.2, CENTER: 0, RIGHT: 3.2 };

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 170),
      new THREE.MeshBasicMaterial({ color: 0x1d4ed8 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.z = -75;
    scene.add(road);

    for (let lx of [-1.6, 1.6]) {
      const lineMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.12, 170),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      lineMesh.rotation.x = -Math.PI / 2;
      lineMesh.position.set(lx, 0.01, -75);
      scene.add(lineMesh);
    }

    const hitZoneLine = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 1.4),
      new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.5 })
    );
    hitZoneLine.rotation.x = -Math.PI / 2;
    hitZoneLine.position.set(0, 0.02, 0);
    scene.add(hitZoneLine);

    const warnZoneLine = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 0.4),
      new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.65 })
    );
    warnZoneLine.rotation.x = -Math.PI / 2;
    warnZoneLine.position.set(0, 0.02, -8);
    scene.add(warnZoneLine);

    const playerGroup = new THREE.Group();
    const playerPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(2.7, 2.7),
      new THREE.MeshBasicMaterial({ map: texPlayer, transparent: true, side: THREE.DoubleSide })
    );
    playerPlane.position.y = 1.35;
    playerGroup.add(playerPlane);

    const shadowMesh = new THREE.Mesh(
      new THREE.CircleGeometry(0.85, 24),
      new THREE.MeshBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.45 })
    );
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.y = 0.03;
    playerGroup.add(shadowMesh);

    scene.add(playerGroup);

    const MIN_SPEED = 0.25;
    const MAX_SPEED = 1.05;
    let currentSpeed = MIN_SPEED;
    let targetSpeed = MIN_SPEED;
    const obstacles = [];
    let score = 0;
    let runTime = 0;

    function spawnObstacle() {
      if (!isGameRunning) return;
      const type = Math.floor(Math.random() * 3);
      const obsGroup = new THREE.Group();

      if (type === 0) {
        const lanes = [-3.2, 0, 3.2];
        const targetX = lanes[Math.floor(Math.random() * lanes.length)];
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(2.6, 2.6),
          new THREE.MeshBasicMaterial({ map: texDino, transparent: true })
        );
        mesh.position.set(targetX, 1.3, 0);
        obsGroup.add(mesh);

        const sh = new THREE.Mesh(new THREE.CircleGeometry(0.85, 16), new THREE.MeshBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.4 }));
        sh.rotation.x = -Math.PI / 2;
        sh.position.set(targetX, 0.02, 0);
        obsGroup.add(sh);

        obsGroup.userData = { type: 'LANE', x: targetX, hit: false };
      } else if (type === 1) {
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(10.5, 3.0),
          new THREE.MeshBasicMaterial({ map: texHurdle, transparent: true })
        );
        mesh.position.set(0, 0.9, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'JUMP', hit: false };
      } else {
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(10.5, 4.4),
          new THREE.MeshBasicMaterial({ map: texCeiling, transparent: true })
        );
        mesh.position.set(0, 2.9, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'DUCK', hit: false };
      }

      obsGroup.position.z = -95;
      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }
    setInterval(spawnObstacle, 2500);

    let targetX = 0;
    let targetY = 0;
    let smoothCenterX = 0.5;
    let baseHipY = null;

    let currentPoseAction = "RUN";
    let isDucking = false;
    let duckCooldownUntil = 0;

    let lastAnkleDelta = 0;
    let stepTimestamps = [];

    let calibrationFrames = 0;
    const REQUIRED_FRAMES = 80;

    const statusMsg = document.getElementById('status-msg');
    const poseProgress = document.getElementById('pose-progress');
    const guideBox = document.getElementById('guide-box');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const setupCanvas = document.getElementById('setup-canvas');
    const setupCtx = setupCanvas.getContext('2d');

    const laneIndicator = document.getElementById('lane-indicator');
    const actionIndicator = document.getElementById('action-indicator');
    const scoreDisplay = document.getElementById('score');
    const speedText = document.getElementById('speed-text');
    const speedGauge = document.getElementById('speed-gauge');

    function onPoseResults(results) {
      if (!results.poseLandmarks) {
        if (!isGameRunning && !isTransitioning) handleCalibrationFail("카메라 앞에 서주세요! 👤");
        return;
      }

      const lm = results.poseLandmarks;
      const nose = lm[0];
      const leftShoulder = lm[11];
      const rightShoulder = lm[12];
      const leftHip = lm[23];
      const rightHip = lm[24];
      const leftAnkle = lm[27];
      const rightAnkle = lm[28];

      if (!isGameRunning) {
        if (isTransitioning) return;

        setupCanvas.width = videoElement.videoWidth;
        setupCanvas.height = videoElement.videoHeight;
        setupCtx.clearRect(0, 0, setupCanvas.width, setupCanvas.height);
        drawSkeleton(setupCtx, lm, setupCanvas.width, setupCanvas.height);

        const isUpperVisible = nose && nose.visibility > 0.5 && leftShoulder && rightShoulder;
        const isHipVisible = leftHip && rightHip && leftHip.visibility > 0.5;

        if (!isUpperVisible || !isHipVisible) {
          handleCalibrationFail("1.5m 뒤로 물러서서 몸을 맞춰주세요!");
          return;
        }

        const centerX = (leftHip.x + rightHip.x) / 2;
        if (centerX < 0.25 || centerX > 0.75) {
          handleCalibrationFail("화면 중앙으로 와주세요! ↔️");
          return;
        }

        calibrationFrames++;
        const percent = Math.min(100, Math.floor((calibrationFrames / REQUIRED_FRAMES) * 100));
        poseProgress.style.width = percent + "%";
        guideBox.classList.add('ready');

        const remainingSec = Math.ceil((REQUIRED_FRAMES - calibrationFrames) / 28);
        countdownOverlay.innerText = remainingSec > 0 ? remainingSec : "GO!";
        statusMsg.innerText = `자세 완벽! 가만히 서 계세요... (${remainingSec}초)`;
        statusMsg.style.color = "#4ade80";

        if (calibrationFrames >= REQUIRED_FRAMES) {
          isTransitioning = true;
          countdownOverlay.innerText = "START! 🏃";
          setTimeout(autoStartGame, 400);
        }
        return;
      }

      if (!leftHip || !rightHip) return;

      const rawCenterX = (leftHip.x + rightHip.x) / 2;
      const currentHipY = (leftHip.y + rightHip.y) / 2;

      smoothCenterX = smoothCenterX * 0.75 + rawCenterX * 0.25;

      if (baseHipY === null) {
        baseHipY = currentHipY;
      } else if (!isDucking && currentPoseAction === "RUN") {
        baseHipY = baseHipY * 0.99 + currentHipY * 0.01;
      }

      if (smoothCenterX < 0.36) {
        targetX = laneX.RIGHT;
        laneIndicator.innerText = "우측";
      } else if (smoothCenterX > 0.64) {
        targetX = laneX.LEFT;
        laneIndicator.innerText = "좌측";
      } else {
        targetX = laneX.CENTER;
        laneIndicator.innerText = "중앙";
      }

      const now = Date.now();
      const yDiff = baseHipY - currentHipY;

      if (yDiff < -0.12) {
        isDucking = true;
        currentPoseAction = "DUCK";
        targetY = -0.75;
        actionIndicator.innerText = "숙이기 ⬇️";
        actionIndicator.style.color = "#a855f7";
        duckCooldownUntil = now + 500;
      } else if (isDucking && yDiff >= -0.12) {
        isDucking = false;
        currentPoseAction = "RUN";
        targetY = 0;
        actionIndicator.innerText = "달리기 🏃";
        actionIndicator.style.color = "#38bdf8";
      } else if (now > duckCooldownUntil && yDiff > 0.13) {
        if (currentPoseAction !== "JUMP") {
          currentPoseAction = "JUMP";
          playTone(659.25, 0.18, 'sine');
        }
        targetY = 1.75;
        actionIndicator.innerText = "점프! 🦘";
        actionIndicator.style.color = "#facc15";
      } else if (now > duckCooldownUntil) {
        currentPoseAction = "RUN";
        targetY = 0;
        actionIndicator.innerText = "달리기 🏃";
        actionIndicator.style.color = "#38bdf8";
      }

      if (currentPoseAction === "RUN" && leftAnkle && rightAnkle) {
        const ankleDelta = Math.abs(leftAnkle.y - rightAnkle.y);
        if (ankleDelta > 0.08 && lastAnkleDelta <= 0.08) {
          stepTimestamps.push(now);
        }
        lastAnkleDelta = ankleDelta;
      }

      stepTimestamps = stepTimestamps.filter(t => now - t < 2000);
      const stepsInLastTwoSec = stepTimestamps.length;

      if (stepsInLastTwoSec >= 5) {
        targetSpeed = MAX_SPEED;
        speedText.innerText = "부스터! 🔥";
        speedText.style.color = "#ef4444";
      } else if (stepsInLastTwoSec >= 2) {
        targetSpeed = 0.65;
        speedText.innerText = "조깅 중 🏃";
        speedText.style.color = "#4ade80";
      } else {
        targetSpeed = MIN_SPEED;
        speedText.innerText = "천천히 🚶";
        speedText.style.color = "#cbd5e1";
      }

      const gaugePercent = ((targetSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)) * 100;
      speedGauge.style.width = `${Math.max(15, gaugePercent)}%`;
    }

    function handleCalibrationFail(msg) {
      calibrationFrames = 0;
      poseProgress.style.width = "0%";
      guideBox.classList.remove('ready');
      countdownOverlay.innerText = "";
      statusMsg.innerText = msg;
      statusMsg.style.color = "#facc15";
    }

    function drawSkeleton(ctx, landmarks, w, h) {
      const connections = [
        [11, 12], [11, 23], [12, 24], [23, 24],
        [11, 13], [13, 15], [12, 14], [14, 16],
        [23, 25], [25, 27], [24, 26], [26, 28]
      ];
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#38bdf8";
      ctx.lineCap = "round";

      connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        if (p1 && p2 && p1.visibility > 0.4 && p2.visibility > 0.4) {
          ctx.beginPath();
          ctx.moveTo(p1.x * w, p1.y * h);
          ctx.lineTo(p2.x * w, p2.y * h);
          ctx.stroke();
        }
      });
    }

    function autoStartGame() {
      unlockAudioOnFirstTouch();
      isGameRunning = true;

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('cam-preview').style.display = 'block';
      const inGameVideo = document.getElementById('in-game-video');
      inGameVideo.srcObject = videoElement.srcObject;
      inGameVideo.play();

      playSuccessSound();
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isGameRunning) {
        currentSpeed += (targetSpeed - currentSpeed) * 0.08;
        runTime += currentSpeed * 0.4;

        if (currentPoseAction === 'RUN') {
          playerPlane.position.y = 1.35 + Math.abs(Math.sin(runTime * 4.2)) * 0.38;
          playerPlane.rotation.z = Math.sin(runTime * 4.2) * 0.09;
          playerPlane.scale.set(1.0, 1.0, 1.0);
        } else if (currentPoseAction === 'JUMP') {
          playerPlane.position.y = 1.35;
          playerPlane.rotation.z = 0;
          playerPlane.scale.set(0.92, 1.18, 1.0);
        } else if (currentPoseAction === 'DUCK') {
          playerPlane.position.y = 0.85;
          playerPlane.rotation.z = 0;
          playerPlane.scale.set(1.2, 0.62, 1.0);
        }

        playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
        playerGroup.position.y += (targetY - playerGroup.position.y) * 0.18;

        road.position.z += currentSpeed;
        if (road.position.z > -50) road.position.z = -75;

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += currentSpeed;

          if (obs.position.z > -1.2 && obs.position.z < 1.2 && !obs.userData.hit) {
            const type = obs.userData.type;
            let safe = true;

            if (type === 'LANE' && Math.abs(playerGroup.position.x - obs.userData.x) < 1.35) {
              safe = false;
            } else if (type === 'JUMP' && playerGroup.position.y < 0.85) {
              safe = false;
            } else if (type === 'DUCK' && playerGroup.position.y > -0.2) {
              safe = false;
            }

            if (!safe) {
              obs.userData.hit = true;
              playHitSound();
              if (navigator.vibrate) navigator.vibrate(120);
              document.body.style.backgroundColor = "#7f1d1d";
              setTimeout(() => document.body.style.backgroundColor = "#0f172a", 90);
            }
          }

          if (obs.position.z > 8) {
            if (!obs.userData.hit) {
              score += 10;
              scoreDisplay.innerText = score;
              playSuccessSound();
            }
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera3D);
    }
    animate();

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const videoElement = document.getElementById('setup-video');
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
