<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>자파리 웜업 러너</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #cam-preview {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 110px;
      height: 146px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #38bdf8;
      font-weight: 800;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #38bdf8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .action-display {
      font-size: 28px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    .dashboard-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .speed-gauge-wrap {
      width: 90px;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    #speed-gauge {
      width: 20%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.15s ease-out;
    }
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 6, 23, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .start-btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <div style="font-size: 24px; font-weight: 800; color: #38bdf8;">자파리 웜업 러너</div>
    <div style="font-size: 14px; color: #94a3b8;">화면을 터치하면 오디오와 함께 시작됩니다</div>
    <button class="start-btn" onclick="startGameAudio()">시작하기 🚀</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <div class="dashboard-panel">
    <div>SCORE: <span id="score" style="color: #38bdf8;">0</span></div>
    <div>속도: <span id="speed-text" style="color: #4ade80;">보통</span></div>
    <div class="speed-gauge-wrap">
      <div id="speed-gauge"></div>
    </div>
  </div>

  <div id="hud">
    <div class="hud-title">ZAPARI WARM-UP RUNNER</div>
    <div class="status-badge" id="lane-indicator">LANE: CENTER</div>
    <div class="action-display" id="action-indicator">READY</div>
  </div>

  <div id="cam-preview">
    <video id="webcam" playsinline></video>
  </div>

  <script>
    // --- 오디오 엔진 ---
    let audioCtx = null;
    function startGameAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('start-overlay').style.display = 'none';
      playTone(523.25, 0.15, 'triangle');
    }

    function playTone(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    }

    function playHitSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // --- Three.js 씬 ---
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1128);
    scene.fog = new THREE.Fog(0x0a1128, 40, 110);

    const camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera3D.position.set(0, 3.8, 7.5);
    camera3D.lookAt(0, 1.2, -15);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(5, 12, 10);
    scene.add(dirLight);

    const laneX = { LEFT: -2.8, CENTER: 0, RIGHT: 2.8 };
    const roadGeo = new THREE.PlaneGeometry(10, 160);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -70;
    scene.add(road);

    const playerGroup = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65 });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.3, 16), bodyMat);
    torso.position.y = 1.3;
    playerGroup.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), bodyMat);
    head.position.y = 2.2;
    playerGroup.add(head);
    scene.add(playerGroup);

    const MIN_SPEED = 0.25;
    const MAX_SPEED = 1.05;
    let currentSpeed = MIN_SPEED;
    let targetSpeed = MIN_SPEED;
    const obstacles = [];
    let score = 0;

    function spawnObstacle() {
      const type = Math.floor(Math.random() * 3);
      const obsGroup = new THREE.Group();

      if (type === 0) {
        const lanes = [-2.8, 0, 2.8];
        const targetX = lanes[Math.floor(Math.random() * lanes.length)];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.5, 1), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
        mesh.position.set(targetX, 1.25, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'LANE', x: targetX, hit: false };
      } else if (type === 1) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.6, 1.2), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
        mesh.position.set(0, 0.3, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'JUMP', hit: false };
      } else {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(8.5, 2.0, 1.5), new THREE.MeshLambertMaterial({ color: 0x8b5cf6 }));
        mesh.position.set(0, 2.4, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'DUCK', hit: false };
      }

      obsGroup.position.z = -90;
      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }
    setInterval(spawnObstacle, 2400);

    // --- 모션 인식 변수 (안정화 필터 적용) ---
    let targetX = 0;
    let targetY = 0;
    let smoothCenterX = 0.5; // 좌우 스무딩용
    let baseHipY = null;

    let currentLaneState = "CENTER";
    let currentPoseAction = "RUN";
    let lastActionChangeTime = 0; // 빠른 플리커링 방지 쿨다운

    let lastAnkleDelta = 0;
    let stepTimestamps = [];

    const laneIndicator = document.getElementById('lane-indicator');
    const actionIndicator = document.getElementById('action-indicator');
    const scoreDisplay = document.getElementById('score');
    const speedText = document.getElementById('speed-text');
    const speedGauge = document.getElementById('speed-gauge');

    function onPoseResults(results) {
      if (!results.poseLandmarks) return;

      const lm = results.poseLandmarks;
      const leftHip = lm[23];
      const rightHip = lm[24];
      const leftAnkle = lm[27];
      const rightAnkle = lm[28];
      if (!leftHip || !rightHip) return;

      const rawCenterX = (leftHip.x + rightHip.x) / 2;
      const currentHipY = (leftHip.y + rightHip.y) / 2;

      // [보정 1] 좌우 좌표 지수 이동평균(EMA) 필터 (떨림 제거)
      smoothCenterX = smoothCenterX * 0.75 + rawCenterX * 0.25;

      // [보정 2] 기준 높이(골반)를 매우 서서히 수렴 (바운스에 휩쓸리지 않도록)
      if (baseHipY === null) {
        baseHipY = currentHipY;
      } else {
        baseHipY = baseHipY * 0.985 + currentHipY * 0.015;
      }

      // [보정 3] 레인 전환 임계치를 넓혀 데드존(중앙 여유 공간) 확보
      // 거울 모드 기준: 0.35 이하 우측, 0.65 이상 좌측, 0.35~0.65는 확실한 중앙
      if (smoothCenterX < 0.35) {
        currentLaneState = "RIGHT";
        targetX = laneX.RIGHT;
      } else if (smoothCenterX > 0.65) {
        currentLaneState = "LEFT";
        targetX = laneX.LEFT;
      } else {
        currentLaneState = "CENTER";
        targetX = laneX.CENTER;
      }
      laneIndicator.innerText = `LANE: ${currentLaneState}`;

      // [보정 4] 점프 & 숙이기 임계치 대폭 상향 (0.065 -> 0.11)
      const now = Date.now();
      const yDiff = baseHipY - currentHipY;

      // 0.35초 쿨다운 적용: 동작이 너무 빠르게 깜빡거리며 바뀌는 현상 차단
      if (now - lastActionChangeTime > 350) {
        if (yDiff > 0.11) { // 확실하게 뛸 때만 점프
          if (currentPoseAction !== "JUMP") {
            currentPoseAction = "JUMP";
            lastActionChangeTime = now;
            playTone(659.25, 0.18, 'sine');
          }
          targetY = 1.6;
          actionIndicator.innerText = "JUMP! 🦘";
        } else if (yDiff < -0.11) { // 확실하게 스쿼트할 때만 숙이기
          if (currentPoseAction !== "DUCK") {
            currentPoseAction = "DUCK";
            lastActionChangeTime = now;
            playTone(329.63, 0.22, 'triangle');
          }
          targetY = -0.6;
          actionIndicator.innerText = "DUCK! ⬇️";
        } else {
          currentPoseAction = "RUN";
          targetY = 0;
          actionIndicator.innerText = "RUNNING 🏃";
        }
      }

      // [보정 5] 발구르기 임계치 상향 (0.045 -> 0.08)
      if (currentPoseAction === "RUN" && leftAnkle && rightAnkle) {
        const ankleDelta = Math.abs(leftAnkle.y - rightAnkle.y);
        if (ankleDelta > 0.08 && lastAnkleDelta <= 0.08) {
          stepTimestamps.push(now);
        }
        lastAnkleDelta = ankleDelta;
      }

      // 최근 2초간 스텝 기록 관리
      stepTimestamps = stepTimestamps.filter(t => now - t < 2000);
      const stepsInLastTwoSec = stepTimestamps.length;

      if (stepsInLastTwoSec >= 5) {
        targetSpeed = MAX_SPEED;
        speedText.innerText = "부스터! 🔥";
        speedText.style.color = "#ef4444";
      } else if (stepsInLastTwoSec >= 2) {
        targetSpeed = 0.65;
        speedText.innerText = "조깅 중 🏃";
        speedText.style.color = "#4ade80";
      } else {
        targetSpeed = MIN_SPEED;
        speedText.innerText = "천천히 🚶";
        speedText.style.color = "#94a3b8";
      }

      const gaugePercent = ((targetSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)) * 100;
      speedGauge.style.width = `${Math.max(15, gaugePercent)}%`;
    }

    // --- 렌더링 루프 ---
    function animate() {
      requestAnimationFrame(animate);

      currentSpeed += (targetSpeed - currentSpeed) * 0.08;

      // 캐릭터 위치 부드러운 완충 이동
      playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
      playerGroup.position.y += (targetY - playerGroup.position.y) * 0.18;

      if (currentPoseAction === "RUN") {
        playerGroup.position.y = Math.abs(Math.sin(Date.now() * (0.015 * (currentSpeed / 0.5)))) * 0.18;
      }

      road.position.z += currentSpeed;
      if (road.position.z > -50) road.position.z = -70;

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += currentSpeed;

        if (obs.position.z > -1.2 && obs.position.z < 1.2 && !obs.userData.hit) {
          const type = obs.userData.type;
          let safe = true;

          if (type === 'LANE' && Math.abs(playerGroup.position.x - obs.userData.x) < 1.1) {
            safe = false;
          } else if (type === 'JUMP' && playerGroup.position.y < 0.8) {
            safe = false;
          } else if (type === 'DUCK' && playerGroup.position.y > -0.2) {
            safe = false;
          }

          if (!safe) {
            obs.userData.hit = true;
            playHitSound();
            if (navigator.vibrate) navigator.vibrate(120);
            document.body.style.backgroundColor = "#7f1d1d";
            setTimeout(() => document.body.style.backgroundColor = "#020617", 90);
          }
        }

        if (obs.position.z > 8) {
          if (!obs.userData.hit) {
            score += 10;
            scoreDisplay.innerText = score;
            playSuccessSound();
          }
          scene.remove(obs);
          obstacles.splice(i, 1);
        }
      }

      renderer.render(scene, camera3D);
    }
    animate();

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const videoElement = document.getElementById('webcam');
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 480,
      height: 640
    });
    camera.start();
  </script>
</body>
</html>
