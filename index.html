<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>자파리 웜업 러너</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #cam-preview {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 110px;
      height: 146px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #38bdf8;
      font-weight: 800;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #38bdf8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .action-display {
      font-size: 28px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    .dashboard-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .speed-gauge-wrap {
      width: 90px;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    #speed-gauge {
      width: 20%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.15s ease-out;
    }

    /* 오디오 시작 안내 오버레이 (모바일 브라우저 보안 규격 대응) */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 6, 23, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .start-btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 모바일 브라우저는 화면을 한 번 터치해야 사운드가 출력됩니다 -->
  <div id="start-overlay">
    <div style="font-size: 24px; font-weight: 800; color: #38bdf8;">자파리 웜업 러너</div>
    <div style="font-size: 14px; color: #94a3b8;">화면을 터치하면 오디오와 함께 시작됩니다</div>
    <button class="start-btn" onclick="startGameAudio()">시작하기 🚀</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <div class="dashboard-panel">
    <div>SCORE: <span id="score" style="color: #38bdf8;">0</span></div>
    <div>속도: <span id="speed-text" style="color: #4ade80;">보통</span></div>
    <div class="speed-gauge-wrap">
      <div id="speed-gauge"></div>
    </div>
  </div>

  <div id="hud">
    <div class="hud-title">ZAPARI WARM-UP RUNNER</div>
    <div class="status-badge" id="lane-indicator">LANE: CENTER</div>
    <div class="action-display" id="action-indicator">READY</div>
  </div>

  <div id="cam-preview">
    <video id="webcam" playsinline></video>
  </div>

  <script>
    // --- 0. 신디사이저 오디오 엔진 (Web Audio API) ---
    let audioCtx = null;

    function startGameAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      document.getElementById('start-overlay').style.display = 'none';
      playTone(523.25, 0.15, 'triangle'); // C5 알림음
    }

    // 단음 사운드 재생
    function playTone(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 아케이드 코인/성공음 (주파수 2단계 상승)
    function playSuccessSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880.00, now + 0.08); // A5
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    }

    // 타격/충돌음 (주파수 하강 노이즈감)
    function playHitSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // --- 1. Three.js 세팅 ---
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1128);
    scene.fog = new THREE.Fog(0x0a1128, 40, 110);

    const camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera3D.position.set(0, 3.8, 7.5);
    camera3D.lookAt(0, 1.2, -15);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(5, 12, 10);
    scene.add(dirLight);

    const laneX = { LEFT: -2.8, CENTER: 0, RIGHT: 2.8 };
    const roadGeo = new THREE.PlaneGeometry(10, 160);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -70;
    scene.add(road);

    // 플레이어 아바타
    const playerGroup = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65 });
    const torsoGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.3, 16);
    const torso = new THREE.Mesh(torsoGeo, bodyMat);
    torso.position.y = 1.3;
    playerGroup.add(torso);

    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const head = new THREE.Mesh(headGeo, bodyMat);
    head.position.y = 2.2;
    playerGroup.add(head);

    scene.add(playerGroup);

    // 속도 제어
    const MIN_SPEED = 0.25;
    const MAX_SPEED = 1.1;
    let currentSpeed = MIN_SPEED;
    let targetSpeed = MIN_SPEED;

    const obstacles = [];
    let score = 0;

    function spawnObstacle() {
      const type = Math.floor(Math.random() * 3);
      const obsGroup = new THREE.Group();

      if (type === 0) {
        const lanes = [-2.8, 0, 2.8];
        const targetX = lanes[Math.floor(Math.random() * lanes.length)];
        const geo = new THREE.BoxGeometry(1.6, 2.5, 1);
        const mat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(targetX, 1.25, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'LANE', x: targetX, hit: false };
      } else if (type === 1) {
        const geo = new THREE.BoxGeometry(8.5, 0.6, 1.2);
        const mat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(0, 0.3, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'JUMP', hit: false };
      } else {
        const geo = new THREE.BoxGeometry(8.5, 2.0, 1.5);
        const mat = new THREE.MeshLambertMaterial({ color: 0x8b5cf6 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(0, 2.4, 0);
        obsGroup.add(mesh);
        obsGroup.userData = { type: 'DUCK', hit: false };
      }

      obsGroup.position.z = -90;
      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }

    setInterval(spawnObstacle, 2400);

    // --- 2. 모션 트래킹 변수 & 매핑 ---
    let targetX = 0;
    let targetY = 0;
    let baseHipY = null;
    let currentLaneState = "CENTER";
    let currentPoseAction = "RUN";
    let prevPoseAction = "RUN";

    let lastAnkleDelta = 0;
    let stepTimestamps = [];

    const laneIndicator = document.getElementById('lane-indicator');
    const actionIndicator = document.getElementById('action-indicator');
    const scoreDisplay = document.getElementById('score');
    const speedText = document.getElementById('speed-text');
    const speedGauge = document.getElementById('speed-gauge');

    function onPoseResults(results) {
      if (!results.poseLandmarks) return;

      const lm = results.poseLandmarks;
      const leftHip = lm[23];
      const rightHip = lm[24];
      const leftAnkle = lm[27];
      const rightAnkle = lm[28];
      if (!leftHip || !rightHip) return;

      const centerX = (leftHip.x + rightHip.x) / 2;
      const currentHipY = (leftHip.y + rightHip.y) / 2;

      if (baseHipY === null) {
        baseHipY = currentHipY;
      } else {
        baseHipY = baseHipY * 0.96 + currentHipY * 0.04;
      }

      // 1) 레인 이동
      if (centerX < 0.40) {
        currentLaneState = "RIGHT";
        targetX = laneX.RIGHT;
      } else if (centerX > 0.60) {
        currentLaneState = "LEFT";
        targetX = laneX.LEFT;
      } else {
        currentLaneState = "CENTER";
        targetX = laneX.CENTER;
      }
      laneIndicator.innerText = `LANE: ${currentLaneState}`;

      // 2) 점프 & 숙이기
      const yDiff = baseHipY - currentHipY;
      if (yDiff > 0.065) {
        currentPoseAction = "JUMP";
        targetY = 1.6;
        actionIndicator.innerText = "JUMP! 🦘";
        if (prevPoseAction !== "JUMP") {
          playTone(659.25, 0.18, 'sine'); // E5 점프음
        }
      } else if (yDiff < -0.065) {
        currentPoseAction = "DUCK";
        targetY = -0.55;
        actionIndicator.innerText = "DUCK! ⬇️";
        if (prevPoseAction !== "DUCK") {
          playTone(329.63, 0.22, 'triangle'); // E4 숙이기음
        }
      } else {
        currentPoseAction = "RUN";
        targetY = 0;
        actionIndicator.innerText = "RUNNING 🏃";

        // 3) 제자리 달리기 감지
        if (leftAnkle && rightAnkle) {
          const ankleDelta = Math.abs(leftAnkle.y - rightAnkle.y);
          const now = Date.now();
          if (ankleDelta > 0.045 && lastAnkleDelta <= 0.045) {
            stepTimestamps.push(now);
          }
          lastAnkleDelta = ankleDelta;
        }
      }

      prevPoseAction = currentPoseAction;

      const now = Date.now();
      stepTimestamps = stepTimestamps.filter(t => now - t < 2000);

      const stepsInLastTwoSec = stepTimestamps.length;
      if (stepsInLastTwoSec >= 5) {
        targetSpeed = MAX_SPEED;
        speedText.innerText = "부스터! 🔥";
        speedText.style.color = "#ef4444";
      } else if (stepsInLastTwoSec >= 2) {
        targetSpeed = 0.65;
        speedText.innerText = "조깅 중 🏃";
        speedText.style.color = "#4ade80";
      } else {
        targetSpeed = MIN_SPEED;
        speedText.innerText = "천천히 🚶";
        speedText.style.color = "#94a3b8";
      }

      const gaugePercent = ((targetSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)) * 100;
      speedGauge.style.width = `${Math.max(15, gaugePercent)}%`;
    }

    // --- 3. 게임 렌더링 & 충돌 피드백 루프 ---
    function animate() {
      requestAnimationFrame(animate);

      currentSpeed += (targetSpeed - currentSpeed) * 0.08;

      playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;
      playerGroup.position.y += (targetY - playerGroup.position.y) * 0.22;

      if (currentPoseAction === "RUN") {
        playerGroup.position.y = Math.abs(Math.sin(Date.now() * (0.015 * (currentSpeed / 0.5)))) * 0.2;
      }

      road.position.z += currentSpeed;
      if (road.position.z > -50) road.position.z = -70;

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += currentSpeed;

        // 충돌 검사
        if (obs.position.z > -1.2 && obs.position.z < 1.2 && !obs.userData.hit) {
          const type = obs.userData.type;
          let safe = true;

          if (type === 'LANE' && Math.abs(playerGroup.position.x - obs.userData.x) < 1.1) {
            safe = false;
          } else if (type === 'JUMP' && playerGroup.position.y < 0.8) {
            safe = false;
          } else if (type === 'DUCK' && playerGroup.position.y > -0.2) {
            safe = false;
          }

          if (!safe) {
            obs.userData.hit = true;
            playHitSound(); // 쿵! 피격음

            // 기기 진동 (안드로이드 지원)
            if (navigator.vibrate) {
              navigator.vibrate(120);
            }

            // 화면 붉은색 타격 플래시
            document.body.style.backgroundColor = "#7f1d1d";
            setTimeout(() => document.body.style.backgroundColor = "#020617", 90);
          }
        }

        // 완벽 회피 통과 시 점수 및 성공음
        if (obs.position.z > 8) {
          if (!obs.userData.hit) {
            score += 10;
            scoreDisplay.innerText = score;
            playSuccessSound(); // 띠링! 코인 성공음
          }
          scene.remove(obs);
          obstacles.splice(i, 1);
        }
      }

      renderer.render(scene, camera3D);
    }

    animate();

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const videoElement = document.getElementById('webcam');
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 480,
      height: 640
    });
    camera.start();
  </script>
</body>
</html>
